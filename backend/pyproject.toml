[project]
name = "blood-donation-api"
version = "0.1.0"
description = "Smart blood donation call & routing system - backend (FastAPI + SQLAlchemy 2 + Celery)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2",
    "celery[redis]>=5.4,<6",
    "redis>=5.2",
    "PyJWT>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
